plugins { id 'com.android.application' }
android {
 namespace 'pe.domenica.viajecusco'
 compileSdk 35
 defaultConfig {
  applicationId 'pe.domenica.viajecusco'
  minSdk 26
  targetSdk 35
  versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
  versionName System.getenv('APP_VERSION_NAME') ?: '1.0'
 }
 signingConfigs {
  release {
   def path = System.getenv('ANDROID_KEYSTORE_PATH')
   if (path) {
    storeFile file(path)
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias 'viaje-cusco'
    keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
   }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.register('copyWebAssets', Copy) {
 from rootProject.file('web')
 into layout.projectDirectory.dir('src/main/assets/web')
}
tasks.named('preBuild') { dependsOn 'copyWebAssets' }
