name: Compilar APK
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versión visible (ejemplo: 1.0, 1.1)'
        required: true
        default: '1.0'
      version_code:
        description: 'Número interno creciente (1, 2, 3...)'
        required: true
        default: '1'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_VERSION_NAME: ${{ inputs.version_name }}
      APP_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Validar versión y archivos
        run: python3 scripts/validate.py
      - name: Preparar SDK Android
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restaurar firma privada
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 scripts/restore_signing.py
      - name: Compilar APK firmada
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/viaje-cusco.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Verificar y preparar descarga
        run: |
          mkdir -p output
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk output/Viaje-Cusco.apk
          sha256sum output/Viaje-Cusco.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: Viaje-Cusco-APK-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Limpiar firma del ejecutor
        if: always()
        run: rm -f "$RUNNER_TEMP/viaje-cusco.p12"
